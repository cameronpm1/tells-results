  2
alg:
  type: ppo
  lr: 3.0e-05
  gamma: 0.99
  nenvs: 6
  cpu_envs: 2
  target_ent: 0.1
  batch: 4096
  batch_size: 256
  num_gpus: 0
  pi:
  - 512
  - 512
  - 512
  vf:
  - 512
  - 512
  - 512
